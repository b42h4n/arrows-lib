[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrows-lib"
version = "0.1.0"
description = "Python library for logic-arrows.io"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "bt" }
]

[tool.setuptools.packages.find]
where = ["src"]
